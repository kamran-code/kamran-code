name: Deploy ESAT Practice Platform (VPS — manual only)

# Deployment now happens on Railway via its native GitHub push-to-deploy
# integration (see esat-practice-platform/deploy/RAILWAY.md), so this VPS
# workflow no longer runs on push. It is kept as a manual fallback: trigger it
# from the Actions tab (Run workflow) if you ever need to ship to the Hostinger
# VPS again.
#
# Builds the Next.js app on the GitHub runner and ships the self-contained
# standalone bundle to the Hostinger VPS over SSH, then restarts the service.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST      IP address or hostname of the VPS
#   VPS_USER      SSH user (e.g. "deploy")
#   VPS_SSH_KEY   private SSH key (full PEM/OpenSSH text) authorized on the VPS
#   VPS_APP_DIR   absolute deploy path on the VPS (e.g. /var/www/esat-prep)
#   VPS_PORT      SSH port (optional — defaults to 22)
#
# The ANTHROPIC_API_KEY lives on the server (see deploy/README.md), not here.

on:
  # Manual only. Railway handles auto-deploy on push; run this by hand from the
  # Actions tab if you need the VPS target.
  workflow_dispatch: {}

# Never run two deploys at once; cancel an in-flight one if a newer push lands.
concurrency:
  group: deploy-esat
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esat-practice-platform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: esat-practice-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Assemble standalone bundle
        run: |
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          # Accept the key as either a raw PEM block or (preferred, paste-safe on
          # mobile) single-line base64. OpenSSH keys corrupt easily when pasted,
          # so base64 avoids newline/whitespace mangling.
          if printf '%s' "$VPS_SSH_KEY" | grep -q "BEGIN"; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          else
            printf '%s' "$VPS_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/id_deploy
          fi
          chmod 600 ~/.ssh/id_deploy
          # Best-effort known_hosts with retries. Don't hard-fail the job if a
          # transient keyscan misses — the ssh/rsync steps below use
          # StrictHostKeyChecking=accept-new so first-connect still works.
          for i in 1 2 3 4 5; do
            if ssh-keyscan -p "$SSH_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            echo "ssh-keyscan attempt $i failed; retrying in 5s..."
            sleep 5
          done
          true

      - name: Deploy to VPS
        env:
          SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          # Ensure the deploy directory exists.
          ssh $SSH_OPTS -i ~/.ssh/id_deploy -p "$SSH_PORT" "$TARGET" "mkdir -p '$APP_DIR'"
          # Sync the standalone bundle (server.js, node_modules, .next, static, public).
          rsync -az --delete \
            -e "ssh $SSH_OPTS -i ~/.ssh/id_deploy -p $SSH_PORT" \
            .next/standalone/ "$TARGET:$APP_DIR/"

      - name: Restart service & health check
        env:
          SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            -i ~/.ssh/id_deploy -p "$SSH_PORT" "$TARGET" \
            "sudo systemctl restart esat-prep && sleep 3 && systemctl is-active esat-prep"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
