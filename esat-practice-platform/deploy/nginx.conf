# Nginx reverse proxy for the ESAT Practice Platform.
# Install to /etc/nginx/sites-available/esat-prep, then:
#   sudo ln -s /etc/nginx/sites-available/esat-prep /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace esat.example.com with your domain (or use the VPS IP / "_" for any host).
# After this works over HTTP, run certbot to add HTTPS (see deploy/README.md);
# certbot rewrites this file to add the TLS server block and an HTTP→HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name esat.example.com;

    # Proxy everything to the Next.js standalone server on 127.0.0.1:3000.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # Long-cache Next.js immutable build assets.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
